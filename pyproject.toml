[tool.poetry]
name = "gohpygossh"
# Should match 'setup.py' version number (used for gopy/pybindgen)
version = "0.9.0"
description = ""
authors = ["b-long <b-long@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">3.11,<=3.15"
pybindgen = "^0.22.1"
wheel = ">=0.42,<0.49"


[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Without this, ruff only treats ohpygossh as first-party when a local build
# has left an ohpygossh/ directory in the repo root, so import sorting differs
# between local runs and CI.
[tool.ruff.lint.isort]
known-first-party = ["ohpygossh"]

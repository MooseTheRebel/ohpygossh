name: PyPIBuild

# Based on:
# - https://github.com/tuananh/py-event-ruler/blob/0129d15e17d0023863a4d0e0e25e5256988b5c5b/.github/workflows/publish.yml
# - https://github.com/adhadse/excelFormExtractor/blob/1f82a97808b3cf3cdb25dcefdc1c6a1c74c5ad45/.github/workflows/build.yaml
#
# The build/test steps themselves live in _build-and-test-wheels.yaml, shared
# with ci.yaml, so a release always publishes exactly what CI built and tested.

on:
    workflow_dispatch:

permissions: {}

jobs:
  build-and-test-wheels:
    permissions:
      contents: read
    uses: $/.github/workflows/_build-and-test-wheels.yaml


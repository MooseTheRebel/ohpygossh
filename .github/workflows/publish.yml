#           name: wheels-windows-amd64
#           path: ./wheelhouse/*.whl


  release:
    permissions:
      contents: write
      # This permission is mandatory for PyPI's trusted publishing
      id-token: write
    needs: build-and-test-wheels
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          with:
            persist-credentials: false
        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8

        - name: Collect all wheels
          run: |
            mkdir dist
            for f in $(find . -type f -name '*.whl'); do mv ${f} dist; done;
            ls -R dist

        # Publish with "trusted publisher" mechanism:
        # https://docs.pypi.org/trusted-publishers/
        #
        # Requires GHA token permission (above in YAML) and PyPI management:
        #   https://pypi.org/manage/project/ohpygossh/settings/publishing/
        - name: Publish package distributions to PyPI
          uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
          with:
            packages-dir: dist/

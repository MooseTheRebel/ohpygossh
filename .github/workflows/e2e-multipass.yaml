---
name: E2E -- Multipass

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  e2e-linux:
    name: E2E Ubuntu (multipass)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project files
        run: |
          rm -rf poetry.lock pyproject.toml
          cat > pyproject.toml << 'EOF'
          [build-system]
          requires = ["setuptools>=40.8.0", "pybindgen"]
          build-backend = "setuptools.build_meta"
          EOF

      - name: Build wheel
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        env:
          CIBW_BUILD: "cp311-*_x86_64"
          CIBW_SKIP: "*-musllinux_x86_64"
          CIBW_ARCHS: "native"
          CIBW_ENVIRONMENT: >
            PATH=$PATH:/usr/local/go/bin
          CIBW_BEFORE_ALL_LINUX: |
            curl -o go.tar.gz https://dl.google.com/go/go1.26.8.linux-amd64.tar.gz
            tar -C /usr/local -xzf go.tar.gz
            go install "github.com/go-python/gopy@$(go list -m -f '{{.Version}}' github.com/go-python/gopy)"
            go install "golang.org/x/tools/cmd/goimports@$(go list -m -f '{{.Version}}' golang.org/x/tools)"

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install multipass
        run: |
          sudo snap install multipass
          # multipassd can take a few seconds to finish initializing after
          # snap install (e.g. writing its root cert); retry until ready.
          for i in $(seq 1 10); do
            if sudo multipass version; then
              exit 0
            fi
            echo "multipassd not ready yet, retrying in 3s... ($i/10)"
            sleep 3
          done
          echo "multipassd did not become ready in time" >&2
          exit 1

      - name: Install wheel
        run: pip install wheelhouse/*.whl

      - name: Run e2e tests
        run: python3 tests/validate_ohpygossh.py --only=multipass

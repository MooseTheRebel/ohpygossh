---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-22.04]
        go-version: [1.26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: go get .
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  just-targets:
    name: just (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # macos-latest runners ship with Homebrew preinstalled; Linux runners don't.
      - name: Install Homebrew
        if: runner.os == 'Linux'
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Install just
        run: brew install just

      - name: just setup
        run: just setup

      - name: just lint
        run: just lint

      # The Go tests start a real, unprivileged sshd on 127.0.0.1; macOS ships
      # /usr/sbin/sshd, Ubuntu runners need the package.
      - name: Install OpenSSH server
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: just test
        run: just test
        env:
          OHPYGOSSH_REQUIRE_SSHD: "1"

  build-and-test-wheels:
    uses: $/.github/workflows/_build-and-test-wheels.yaml

---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-22.04]
        go-version: [1.26.x]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: go get .
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: pre-commit/action@v3.0.1

  just-targets:
    name: just (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # macos-latest runners ship with Homebrew preinstalled; Linux runners don't.
      - name: Install Homebrew
        if: runner.os == 'Linux'
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Install just
        run: brew install just

      - name: just setup
        run: just setup

      - name: just lint
        run: just lint

      - name: just test
        run: just test

  build-and-test-wheels:
    uses: ./.github/workflows/_build-and-test-wheels.yaml

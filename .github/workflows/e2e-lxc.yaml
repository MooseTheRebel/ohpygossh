---
name: E2E -- LXC

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  e2e-lxc:
    name: E2E Ubuntu (lxc)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project files
        run: |
          rm -rf poetry.lock pyproject.toml
          cat > pyproject.toml << 'EOF'
          [build-system]
          requires = ["setuptools>=40.8.0", "pybindgen"]
          build-backend = "setuptools.build_meta"
          EOF

      - name: Build wheel
        uses: pypa/cibuildwheel@8c2dcd2e96041a619f5ff03c9638d7941e2553a4 # v4.3.3
        env:
          CIBW_BUILD: "cp311-*_x86_64"
          CIBW_SKIP: "*-musllinux_x86_64"
          CIBW_ARCHS: "native"
          CIBW_ENVIRONMENT: >
            PATH=$PATH:/usr/local/go/bin
          CIBW_BEFORE_ALL_LINUX: |
            curl -o go.tar.gz https://dl.google.com/go/go1.26.8.linux-amd64.tar.gz
            tar -C /usr/local -xzf go.tar.gz
            go install "github.com/go-python/gopy@$(go list -m -f '{{.Version}}' github.com/go-python/gopy)"
            go install "golang.org/x/tools/cmd/goimports@$(go list -m -f '{{.Version}}' golang.org/x/tools)"

      - name: Setup Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: latest/edge

      - name: Allow LXD bridge traffic
        run: sudo iptables -P FORWARD ACCEPT

      - name: Install wheel
        run: pip install wheelhouse/*.whl

      - name: Run e2e tests
        run: python3 tests/validate_ohpygossh.py --only=lxc
